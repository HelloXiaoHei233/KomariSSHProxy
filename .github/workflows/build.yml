name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.0. Leave empty to build artifact only."
        required: false
        type: string
      release_title:
        description: "Release title. Defaults to Komari SSH Proxy <tag>."
        required: false
        type: string
      prerelease:
        description: "Mark this release as a prerelease."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Compile sources
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Source compilation failed' }

      - name: Check application installation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          python main.py --check-mcp
          if ($LASTEXITCODE -ne 0) { throw 'Application installation check failed' }

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed' }

      - name: Build onefile executable
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean KomariSSHProxy.spec
          if ($LASTEXITCODE -ne 0) { throw 'Executable build failed' }

      - name: Check packaged MCP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = (Resolve-Path -LiteralPath 'dist/Komari SSH Proxy.exe').Path
          $reportPath = Join-Path $env:RUNNER_TEMP 'komari-mcp-check.txt'
          $check = Start-Process -FilePath $exePath -ArgumentList @('--check-mcp', '--check-mcp-report', ('"{0}"' -f $reportPath)) -WindowStyle Hidden -PassThru -Wait
          if (Test-Path -LiteralPath $reportPath) { Get-Content -LiteralPath $reportPath -Encoding UTF8 }
          if ($check.ExitCode -ne 0) { throw 'Packaged MCP check failed' }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v5
        with:
          name: Komari-SSH-Proxy-windows
          path: dist/Komari SSH Proxy.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-windows
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v5
        with:
          name: Komari-SSH-Proxy-windows
          path: release

      - name: Write release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          登录方式支持账号密码和OAuth登录
          为MCP支持了文件操作
          优化了MCP操作流程
          修复边框大小无法拖拽的问题
          '@ | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Create release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $title = $env:RELEASE_TITLE
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = "Komari SSH Proxy $env:RELEASE_TAG"
          }

          $releaseArgs = @(
            "release", "create", $env:RELEASE_TAG,
            "release/Komari SSH Proxy.exe",
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", $title,
            "--notes-file", "release-notes.md"
          )

          if ($env:PRERELEASE -eq "true") {
            $releaseArgs += "--prerelease"
          } else {
            $releaseArgs += "--latest"
          }

          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
